; Sprout — an ambient desk companion for the CYD 3.5" (Sunton ESP32-3248S035R)
; Display: ST7796 320x480, touch XPT2046, both on HSPI. See README.md.

[env:esp32-3248s035r]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; ST7796 + XPT2046 driver. Pins are set explicitly in src/LGFX_Sprout.hpp,
; so LovyanGFX needs no User_Setup / build-flag pin config.
lib_deps =
    lovyan03/LovyanGFX@^1.2.0
    bblanchon/ArduinoJson@^6.21.5

build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=3

; 4 MB flash WROOM-32, no PSRAM on this board.
board_build.flash_mode = dio
board_build.f_flash = 80000000L
